name: Deploy Robotics Intelligence to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "intelligence/**"
      - "scripts/build_robotics_site.py"
      - "scripts/update_robotics_jobs.py"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    # 08:00 Asia/Colombo (UTC+05:30; Sri Lanka has no DST).
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh official jobs
        run: python scripts/update_robotics_jobs.py

      - name: Build static site data
        run: python scripts/build_robotics_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
