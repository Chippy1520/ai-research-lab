<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Living mind map of embodied AI, VLAs, perception, learning, frameworks, and robotics labs — click a concept for resources and jobs.">
  <meta name="theme-color" content="#f3f0e8">
  <title>Embodied AI mind map · AI Research Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/curriculum.css">
  <link rel="stylesheet" href="assets/papers.css">
  <link rel="stylesheet" href="assets/mindmap.css">
</head>
<body class="editorial mm-page">
  <header class="topbar editorial-nav">
    <a class="brand" href="curriculum.html"><span class="brand-mark">∇</span><span>AI Research Lab</span></a>
    <nav aria-label="Primary navigation">
      <a href="mindmap.html">Mind map</a>
      <a href="papers.html">Paper guides</a>
      <a href="curriculum.html">Curriculum</a>
      <a href="index.html">Robotics intelligence ↗</a>
    </nav>
  </header>

  <div class="mm-shell">
    <div class="mm-stage" id="mm-stage">
      <div class="mm-toolbar">
        <input id="mm-search" type="search" placeholder="Search concepts…" enterkeyhint="search" aria-label="Search the mind map">
        <button type="button" class="mm-chip" id="mm-fit" title="Fit all">Fit</button>
        <div id="mm-filters" class="mm-filters"></div>
      </div>
      <div id="mm-cy" role="img" aria-label="Embodied AI concept graph"></div>
      <div class="mm-legend" id="mm-legend" aria-label="Color key">
        <span><i class="k-hub"></i>hub</span>
        <span><i class="k-domain"></i>branch</span>
        <span><i class="k-concept"></i>idea</span>
        <span><i class="k-method"></i>algorithm</span>
        <span><i class="k-paper"></i>paper</span>
        <span><i class="k-framework"></i>code</span>
        <span><i class="k-lab"></i>lab</span>
      </div>
      <div class="mm-hint" id="mm-hint">Pinch to zoom · tap a node</div>
    </div>
    <aside class="mm-panel" id="mm-panel" aria-live="polite">
      <button type="button" class="mm-sheet-bar" id="mm-sheet-toggle" aria-label="Expand or collapse details">
        <span class="mm-grip"></span>
      </button>
      <div class="mm-panel-body" id="mm-panel-body">
        <p class="mm-empty">Tap Embodied AI in the centre. Green nodes are branches; gold is an algorithm; blue is a paper; grey labs carry jobs.</p>
      </div>
    </aside>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="assets/mindmap.js"></script>
</body>
</html>
